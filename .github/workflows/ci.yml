name: CI

on:
  push:
    branches: [main, ledgerly-app]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them
# queue up and finish out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # @prisma/client's own postinstall already runs this, but pinning it
      # explicitly guards against that being skipped by a future npm/CI
      # config change (e.g. --ignore-scripts) — schema.prisma types must
      # exist before typecheck/build can even resolve @prisma/client.
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Pure unit tests only (no service touches Prisma/the DB — verified),
      # so no Postgres service container is needed here.
      - name: Unit tests
        run: npm run test

      # No live database is reached during `next build` — every DB-backed
      # route in this app is force-dynamic (cookie-based session checks),
      # so nothing queries at build time. These are placeholder values in
      # the shape better-auth/Prisma expect, not real secrets.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
          BETTER_AUTH_URL: "http://localhost:3000"
          CRON_SECRET: "ci-placeholder"
